spring:
  application:
    name: GrowthHub
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/growthhub}
    username: ${DB_USER:growthhub}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  timezone: ${APP_TIMEZONE:Asia/Shanghai}
