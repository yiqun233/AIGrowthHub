name: GrowthHub checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: growthhub_test
          POSTGRES_USER: growthhub
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U growthhub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Isolated API and browser checks
        run: |
          printf '%s\n' DB_USER=growthhub DB_PASSWORD=ci-only-ephemeral > .env
          chmod 600 .env
          python3 scripts/test.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            .runtime/test-backend.log
            frontend/test-results/
