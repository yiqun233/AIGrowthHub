name: GrowthHub checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: growthhub_test
          POSTGRES_USER: growthhub
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U growthhub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Local configuration parsing
        run: python3 scripts/local_env_test.py
      - name: Isolated API and browser checks
        run: |
          printf '%s\n' DB_USER=growthhub DB_PASSWORD=ci-only-ephemeral > .env
          chmod 600 .env
          mkdir -p .runtime
          if ! python3 -u scripts/test.py > .runtime/ci-regression.log 2>&1; then
            cat .runtime/ci-regression.log
            python3 - <<'PY'
          from pathlib import Path
          for name in ('ci-regression.log', 'test-backend.log'):
              path = Path('.runtime') / name
              if path.exists():
                  message = path.read_text(errors='replace')[-12000:]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={name}::{message}')
          PY
            exit 1
          fi
          cat .runtime/ci-regression.log

      - name: Session authentication checks
        run: python3 scripts/security_test.py
      - name: Validate production Compose
        run: docker compose --env-file infra/.env.production.example -f infra/compose.prod.yml config --quiet
      - name: Build deployment images
        run: |
          docker build -f infra/backend.Dockerfile -t growthhub-backend:ci .
          docker build -f infra/frontend.Dockerfile -t growthhub-web:ci .
      - name: Full local HTTPS deployment check
        run: python3 scripts/deployment_check.py
      - name: Backup retention policy
        run: mkdir -p backups && python3 scripts/backup_policy_test.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            .runtime/ci-regression.log
            .runtime/test-backend.log
            .runtime/security-test.log
            frontend/test-results/
